services:
  design-patterns-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: design-patterns-mcp
    ports:
      - "${HTTP_PORT:-3000}:${HTTP_PORT:-3000}"
    environment:
      - TRANSPORT_MODE=${TRANSPORT_MODE:-http}
      - HTTP_BIND_HOST=${HTTP_BIND_HOST:-0.0.0.0}
      - HTTP_PORT=${HTTP_PORT:-3000}
      - MCP_ENDPOINT=${MCP_ENDPOINT:-/mcp}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_PATH=/app/data/design-patterns.db
      - ENABLE_HYBRID_SEARCH=true
      - ENABLE_GRAPH_AUGMENTATION=true
      - SKIP_DB_SETUP=false
    volumes:
      - design-patterns-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "if [ \"${DISABLE_HEALTHCHECK:-0}\" = \"1\" ] || [ \"${TRANSPORT_MODE:-http}\" = \"stdio\" ]; then exit 0; fi; wget -q --spider \"http://127.0.0.1:${HTTP_PORT:-3000}${HEALTH_CHECK_PATH:-/health}\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  design-patterns-data:
    driver: local
